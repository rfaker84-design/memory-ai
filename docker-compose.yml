# ╔══════════════════════════════════════════════════════════════╗
# ║  docker-compose.yml — 忆见 Memory AI V5 生产部署           ║
# ║  App + Redis + Nginx                                       ║
# ╚══════════════════════════════════════════════════════════════╝

version: "3.9"

services:
  app:
    build: .
    container_name: memoryai-app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=127.0.0.1
      - AUTH_PROXY_LOOPBACK_ONLY=true
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - VOLC_API_KEY=${VOLC_API_KEY}
      - VOLC_BASE_URL=${VOLC_BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: memoryai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: memoryai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/memoryai.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html/static:ro
      - certbot_data:/var/www/certbot
      - ssl_certs:/etc/letsencrypt
    depends_on:
      - app

volumes:
  redis_data:
  certbot_data:
  ssl_certs:
