# ╔══════════════════════════════════════════════════════════════╗
# ║  Nginx — 忆见 Memory AI V5 生产配置                        ║
# ║  CDN 缓存 + 静态资源加速 + 反向代理 + SSL                  ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Upstream ───────────────────────────────────────────────────
upstream app_servers {
    least_conn;
    server app:3000 weight=1 max_fails=3 fail_timeout=30s;
    # 扩容时添加: server app-2:3000 weight=1;
    keepalive 32;
}

# ── HTTP → HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yijianmemory.cn www.yijianmemory.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yijianmemory.cn www.yijianmemory.cn;

    # SSL
    ssl_certificate /etc/letsencrypt/live/yijianmemory.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yijianmemory.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # ── CDN: Static Assets (long cache) ─────────────────────────
    location /_next/static {
        alias /app/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-CDN "MemoryAI-Edge";
        access_log off;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-CDN "MemoryAI-Edge";
        access_log off;
    }

    # ── CDN: Avatar & Audio assets ──────────────────────────────
    location ~* \.(png|jpg|jpeg|webp|svg|mp3|wav|ogg|aac)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-CDN "MemoryAI-Edge";
        access_log off;
        try_files $uri @app;
    }

    # ── WebSocket (实时数字人) ──────────────────────────────────
    location /ws {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API (限流 + 代理) ──────────────────────────────────────
    location /api/ {
        # 限流: 100 req/s per IP burst 50
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_cache_bypass $http_authorization;
    }

    # ── Main App ────────────────────────────────────────────────
    location / {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Fallback ────────────────────────────────────────────────
    location @app {
        proxy_pass http://app_servers;
        proxy_set_header Host $host;
    }
}

# ── Rate Limit Zone ────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
