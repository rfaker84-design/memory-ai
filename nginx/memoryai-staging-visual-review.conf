# Include these three directives only inside the existing HTTPS staging
# `location /` block, immediately before the normal proxy_set_header lines.
# The empty default overwrites/removes any client-supplied marker. The exact
# /32 therefore receives the internal marker on every request; the server
# accepts it as direct review authority only for GET/HEAD within its expiry.
set $memoryai_staging_visual_review "";
if ($remote_addr = 104.28.244.19) { set $memoryai_staging_visual_review "1"; }
proxy_set_header X-MemoryAI-Staging-Visual-Review $memoryai_staging_visual_review;
