name: Staging Web immutable BuildKit artifact

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact immutable 40-character application source commit
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/staging-web-artifact-request.json

permissions:
  contents: read

jobs:
  export:
    name: Build Linux standalone artifact only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: staging-web-immutable-artifact-${{ inputs.source_commit || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out the versioned runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve exact application source
        id: request
        shell: bash
        env:
          DISPATCH_SOURCE_COMMIT: ${{ inputs.source_commit || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            source_commit="$DISPATCH_SOURCE_COMMIT"
          else
            source_commit="$(node -e 'const request=require("./.github/staging-web-artifact-request.json"); if (request.schemaVersion !== 1 || request.component !== "web" || request.environment !== "staging") process.exit(2); process.stdout.write(request.sourceCommit)' )"
          fi
          printf '%s\n' "$source_commit" | grep -Eq '^[0-9a-f]{40}$'
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Check out the exact application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.request.outputs.source_commit }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse substituted or dirty source
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$(git -C source rev-parse HEAD)"
          test -z "$(git -C source status --porcelain)"
          git -C source rev-parse HEAD
          git -C source rev-parse HEAD^{tree}

      - name: Export immutable Linux BuildKit archive
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(git -C source rev-parse HEAD)
          source_tree=$(git -C source rev-parse HEAD^{tree})
          docker buildx version
          docker buildx build --pull=false \
            --build-arg "STAGING_WEB_ARTIFACT_SOURCE_COMMIT=$source_commit" \
            --build-arg "STAGING_WEB_ARTIFACT_SOURCE_TREE=$source_tree" \
            --build-arg "STAGING_WEB_ARTIFACT_RUNNER_COMMIT=$RUNNER_COMMIT" \
            --target export \
            --output "type=local,dest=artifacts/staging-web-immutable-$source_commit" \
            -f scripts/ops/Dockerfile.staging-web-artifact .
          cd "artifacts/staging-web-immutable-$source_commit"
          sha256sum --check "memoryai-staging-web-$source_commit.tar.gz.sha256"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "memoryai-staging-web-$source_commit.tar.gz" -C "$verify_dir"
          ( cd "$verify_dir" && sha256sum --check SHA256SUMS )
          test "$(node -e 'const value=require(process.argv[1]); process.stdout.write(String(value.build.featureFlags.qwenAudioTtsFlashVoiceClone === true && value.build.featureFlags.NEXT_PUBLIC_SOUNDSCAPE_ENABLED === true && value.source.commit === process.argv[2]))' "$verify_dir/manifest.json" "$source_commit")" = true
          rm -rf "$verify_dir"
          trap - EXIT

      - name: Upload immutable archive and evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: staging-web-immutable-${{ steps.request.outputs.source_commit }}
          path: artifacts/staging-web-immutable-${{ steps.request.outputs.source_commit }}
          if-no-files-found: error
          retention-days: 90
