name: One-time optimize approved home carousel media

on:
  push:
    branches:
      - codex/one-time-dispatch-carousel-no-loop-20260901

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4af4f4caa0ce49443ad7beb77bef8b0e0b066c8b
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and optimize the same five approved films
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4af4f4caa0ce49443ad7beb77bef8b0e0b066c8b"
          mkdir -p /tmp/home-v2
          for input in public/home-hero-assets/*.home-v2.mp4; do
            output="/tmp/home-v2/$(basename "$input")"
            ffmpeg -hide_banner -loglevel error -y -i "$input" -an               -c:v libx264 -preset slow -crf 22 -profile:v main -level 4.0               -pix_fmt yuv420p -movflags +faststart -g 48 -keyint_min 48               -sc_threshold 0 -bf 2 "$output"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$output")" = "1920"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$output")" = "1080"
            duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$output")"
            awk -v value="$duration" 'BEGIN { exit !(value > 8.07 && value < 8.10) }'
            mv "$output" "$input"
          done
          test "$(find public/home-hero-assets -maxdepth 1 -name '*.home-v2.mp4' | wc -l)" = "5"
          git diff --stat -- public/home-hero-assets
          test "$(git diff --name-only -- public/home-hero-assets | wc -l)" = "5"
          test -z "$(git diff --name-only -- . ':!public/home-hero-assets/*.home-v2.mp4')"

      - name: Commit optimized delivery assets to the candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yijian-ai"
          git config user.email "rfaker84@gmail.com"
          git add public/home-hero-assets/*.home-v2.mp4
          git commit -m "perf(home): optimize approved carousel delivery"
          git push origin HEAD:refs/heads/codex/home-carousel-no-loop-single-playback-20260901
